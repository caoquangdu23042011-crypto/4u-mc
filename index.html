<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4u</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .font-cursive {
            font-family: 'Great Vibes', cursive;
        }

        /* Canvas Nền Trái Tim Bay (Sky Blue & Soft Pink) */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        /* Canvas Hạt Trái Tim Tỏa Ra Từ Bó Hoa */
        #burstCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }

        /* MÀN HÌNH CHỜ TRẮNG BAN ĐẦU & SLIDER GẠT MỞ */
        #startOverlay {
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
        }

        .slider-track {
            position: relative;
            width: 280px;
            height: 60px;
            background: rgba(240, 246, 255, 0.9);
            border-radius: 40px;
            padding: 5px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.06), 0 10px 25px rgba(135, 206, 235, 0.25);
            border: 1px solid rgba(135, 206, 235, 0.4);
            overflow: hidden;
        }

        .slider-thumb {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #f472b6);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.5);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 2;
            touch-action: none;
        }

        .slider-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #0284c7;
            padding-left: 30px;
            pointer-events: none;
        }

        /* HỘP QUÀ 2.5D CÓ HIỆU ỨNG CO GIÃN & THÁO GRADIENT PHÁT SÁNG */
        .gift-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
            cursor: pointer;
            perspective: 800px;
        }

        /* Vùng Gradient phát sáng co giãn nhẹ xung quanh hộp quà */
        .gift-wrapper::before {
            content: '';
            position: absolute;
            inset: -15px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.6) 0%, rgba(244, 114, 182, 0.4) 50%, transparent 75%);
            filter: blur(20px);
            z-index: 0;
            animation: giftPulseGlow 2.5s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes giftPulseGlow {
            0% {
                transform: scale(0.88);
                opacity: 0.5;
            }
            100% {
                transform: scale(1.15);
                opacity: 0.95;
            }
        }

        .gift-box-25d {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            animation: giftBounce 3s ease-in-out infinite alternate;
        }

        @keyframes giftBounce {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); }
            100% { transform: translateY(0) scale(1); }
        }

        .gift-wrapper:hover .gift-box-25d {
            transform: translateY(-10px) scale(1.05);
        }

        /* SVG Hộp quà 2.5D tỉ mỉ */
        .gift-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 15px rgba(56, 189, 248, 0.4));
        }

        .gift-lid-group {
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: 100px 40px;
        }

        /* Khi mở hộp quà: Nắp bật lật ngửa lên trên */
        .gift-box-25d.open .gift-lid-group {
            transform: translateY(-70px) rotate(-25deg) scale(0.9);
        }

        /* BÓ HOA PNG TÁCH NỀN VỚI HÀO QUANG RADIAL */
        .bouquet-glow-wrapper {
            position: relative;
            display: inline-block;
        }
        .bouquet-glow-wrapper::before {
            content: '';
            position: absolute;
            inset: -25px;
            background: radial-gradient(circle, rgba(125, 211, 252, 0.5) 0%, rgba(244, 114, 182, 0.35) 50%, transparent 75%);
            filter: blur(25px);
            z-index: 0;
            border-radius: 50%;
            animation: auraPulse 3s ease-in-out infinite alternate;
        }

        @keyframes auraPulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.08); opacity: 1; }
        }

        /* LÁ THƯ TÌNH MÀU GIẤY CAO CẤP */
        .paper-card {
            background-color: #fdfbf7;
            background-image: radial-gradient(#e2e8f0 0.75px, transparent 0.75px);
            background-size: 12px 12px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(125, 211, 252, 0.2);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between items-center p-4">

    <!-- CANVAS NỀN TRÁI TIM BAY (XANH & HỒNG) -->
    <canvas id="bgCanvas"></canvas>

    <!-- MÀN HÌNH CHỜ TRẮNG BAN ĐẦU -->
    <div id="startOverlay">
        <div class="text-center space-y-8 px-4">
            <div class="w-16 h-16 mx-auto bg-sky-100 text-sky-500 rounded-full flex items-center justify-center text-2xl shadow-inner">
                <i class="fa-solid fa-gift animate-bounce"></i>
            </div>
            
            <div class="slider-track mx-auto" id="sliderTrack">
                <div class="slider-text">Gạt sang để mở <i class="fa-solid fa-angles-right ml-2 animate-pulse"></i></div>
                <div class="slider-thumb" id="sliderThumb">
                    <i class="fa-solid fa-heart text-white text-lg"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- NỘI DUNG CHÍNH -->
    <main class="w-full max-w-md my-auto z-20 flex flex-col items-center justify-center min-h-[400px]">

        <!-- BƯỚC 1: HỘP QUÀ 2.5D CÓ GRADIENT CO GIÃN -->
        <div id="step1Box" class="flex flex-col items-center text-center space-y-6 transition-all duration-500">
            <div class="gift-wrapper" id="giftBoxBtn">
                <div class="gift-box-25d" id="giftBox25D">
                    <svg class="gift-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Gradients Thân Hộp -->
                            <linearGradient id="bodyFront" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#1e3a8a"/>
                                <stop offset="100%" stop-color="#0f172a"/>
                            </linearGradient>
                            <linearGradient id="bodySide" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#0f2b5c"/>
                                <stop offset="100%" stop-color="#020617"/>
                            </linearGradient>

                            <!-- Gradients Nắp Hộp -->
                            <linearGradient id="lidTop" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#7dd3fc"/>
                                <stop offset="100%" stop-color="#38bdf8"/>
                            </linearGradient>
                            <linearGradient id="lidSide" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#0284c7"/>
                                <stop offset="100%" stop-color="#0369a1"/>
                            </linearGradient>

                            <!-- Ribbon Gradient -->
                            <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ffffff"/>
                                <stop offset="100%" stop-color="#e0f2fe"/>
                            </linearGradient>
                        </defs>

                        <!-- THÂN HỘP QUÀ (GÓC NHÌN ISOMETRIC 2.5D) -->
                        <g id="gift-body">
                            <!-- Mặt trước trái -->
                            <path d="M 30 100 L 100 135 L 100 180 L 30 145 Z" fill="url(#bodyFront)" stroke="#38bdf8" stroke-width="0.5"/>
                            <!-- Mặt trước phải -->
                            <path d="M 100 135 L 170 100 L 170 145 L 100 180 Z" fill="url(#bodySide)" stroke="#38bdf8" stroke-width="0.5"/>
                            
                            <!-- Ruy băng thân hộp -->
                            <path d="M 60 115 L 60 160 L 72 166 L 72 121 Z" fill="url(#ribbonGrad)" opacity="0.9"/>
                            <path d="M 135 117 L 135 162 L 147 156 L 147 111 Z" fill="url(#ribbonGrad)" opacity="0.8"/>
                        </g>

                        <!-- NẮP HỘP QUÀ (CÓ THỂ BẬT TÁCH RỜI) -->
                        <g class="gift-lid-group" id="giftLid">
                            <!-- Thành nắp dưới trái -->
                            <path d="M 24 88 L 100 125 L 100 137 L 24 100 Z" fill="url(#lidSide)"/>
                            <!-- Thành nắp dưới phải -->
                            <path d="M 100 125 L 176 88 L 176 100 L 100 137 Z" fill="#0284c7"/>

                            <!-- Mặt trên nắp hộp -->
                            <path d="M 100 50 L 176 88 L 100 125 L 24 88 Z" fill="url(#lidTop)" stroke="#ffffff" stroke-width="0.8"/>

                            <!-- Dải ruy-băng bắt chéo mặt trên -->
                            <path d="M 58 67 L 72 60 L 142 108 L 128 115 Z" fill="url(#ribbonGrad)"/>
                            <path d="M 142 67 L 128 60 L 58 108 L 72 115 Z" fill="url(#ribbonGrad)"/>

                            <!-- NƠ LỤA 3D VÀ TAG CẠNH NƠ -->
                            <!-- Cánh nơ 1 -->
                            <path d="M 100 87 C 80 65, 60 80, 100 87 Z" fill="url(#ribbonGrad)" stroke="#bae6fd" stroke-width="0.5"/>
                            <!-- Cánh nơ 2 -->
                            <path d="M 100 87 C 120 65, 140 80, 100 87 Z" fill="url(#ribbonGrad)" stroke="#bae6fd" stroke-width="0.5"/>
                            <!-- Cánh nơ 3 -->
                            <path d="M 100 87 C 80 105, 60 90, 100 87 Z" fill="url(#ribbonGrad)" stroke="#bae6fd" stroke-width="0.5"/>
                            <!-- Cánh nơ 4 -->
                            <path d="M 100 87 C 120 105, 140 90, 100 87 Z" fill="url(#ribbonGrad)" stroke="#bae6fd" stroke-width="0.5"/>

                            <!-- Nút thắt tâm -->
                            <circle cx="100" cy="87" r="6" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))"/>

                            <!-- Thẻ Tag nhỏ treo ở nơ -->
                            <rect x="105" y="92" width="14" height="20" rx="2" transform="rotate(15 105 92)" fill="#ffffff" stroke="#38bdf8" stroke-width="0.8"/>
                            <circle cx="112" cy="96" r="1.5" fill="#38bdf8"/>
                        </g>
                    </svg>
                </div>
            </div>
            <p class="text-xs text-sky-200/80 tracking-wide font-medium">Bấm vào hộp quà để mở</p>
        </div>

        <!-- BƯỚC 2: BÓ HOA PNG + LÁ THƯ TÌNH GỌN GÀNG -->
        <div id="step2Content" class="hidden w-full space-y-6 transition-all duration-700 opacity-0 transform translate-y-8 relative">
            
            <!-- CANVAS HIỆU ỨNG TRÁI TIM TỎA RA TỪ BÓ HOA -->
            <canvas id="burstCanvas"></canvas>

            <!-- BÓ HOA PNG TÁCH NỀN -->
            <div class="flex flex-col items-center justify-center pt-2">
                <div class="bouquet-glow-wrapper cursor-pointer" id="bouquetContainer">
                    <!-- FILE BÓ HOA PNG TÁCH NỀN (KÍCH THƯỚC 500x500) -->
                    <img id="bouquetImg" 
                         src="f.png" 
                         alt="Bó hoa tặng cậu" 
                         width="500"
                         height="500"
                         class="relative z-10 w-64 h-64 md:w-72 md:h-72 object-contain drop-shadow-[0_15px_25px_rgba(56,189,248,0.4)] transition-transform hover:scale-105 duration-300">
                </div>
            </div>

            <!-- LÁ THƯ TÌNH MÀU GIẤY CAO CẤP -->
            <div class="paper-card p-6 md:p-8 space-y-6 relative overflow-hidden">
                <!-- Vạch trang trí góc lá thư -->
                <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-sky-300 via-pink-300 to-sky-300"></div>

                <!-- ẢNH BẠN ẤY (KHUNG TRÒN KÍCH THƯỚC 410x410) -->
                <div class="flex flex-col items-center">
                    <div class="w-28 h-28 rounded-full p-1 bg-gradient-to-tr from-sky-400 to-pink-300 shadow-md mb-2">
                        <!-- FILE ẢNH JPG CỦA BẠN ẤY (KÍCH THƯỚC 410x410) -->
                        <img id="herPhoto" 
                             src="u.jpg" 
                             alt="Ảnh Bạn Ấy" 
                             width="410"
                             height="410"
                             class="w-full h-full object-cover rounded-full">
                    </div>
                </div>

                <!-- LỜI CHÚC NỘI DUNG SẠCH SẼ -->
                <div class="space-y-4 text-center">
                    <h2 class="text-2xl font-cursive font-bold text-sky-600">Tui chúc bạn 20/10 nè!</h2>
                    
                    <div class="text-slate-700 text-sm leading-relaxed space-y-3 font-medium">
                        <p>
                            Chúc bạn luôn xinh đẹp, dễ thương, ngoan ngoãn, chăm ngoan, học giỏi nha!
                        </p>
                        <p>
                            Chúc bạn bớt khó ưa lại xíu 😏.
                        </p>
                    </div>

                    <div class="pt-2 text-right">
                        <p class="font-cursive text-xl text-sky-500">Gửi Thảo Như</p>
                    </div>
                </div>
            </div>

        </div>

    </main>


    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (burstCanvas) {
                burstCanvas.width = width;
                burstCanvas.height = height;
            }
        });

        const hearts = [];
        // Icon vector trái tim màu xanh sky blue (🩵) và màu hồng nhạt (🩷)
        const heartIcons = ['🩵', '🩷', '🩵', '🩷', '🤍'];

        class Heart {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 100;
                this.size = Math.random() * 14 + 10;
                this.speedY = Math.random() * 1.2 + 0.5;
                this.speedX = Math.sin(Math.random() * Math.PI) * 0.7;
                this.icon = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                this.alpha = Math.random() * 0.7 + 0.3;
                this.pulseSpeed = Math.random() * 0.03 + 0.01;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.02;
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotSpeed;
                this.alpha += Math.sin(Date.now() * this.pulseSpeed) * 0.01;

                if (this.y < -30) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = Math.max(0, Math.min(1, this.alpha));
                ctx.font = `${this.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.icon, 0, 0);
                ctx.restore();
            }
        }

        for (let i = 0; i < 45; i++) {
            hearts.push(new Heart());
        }

        const burstCanvas = document.getElementById('burstCanvas');
        const bCtx = burstCanvas.getContext('2d');
        burstCanvas.width = width;
        burstCanvas.height = height;

        const burstParticles = [];

        class BurstParticle {
            constructor(startX, startY) {
                this.x = startX;
                this.y = startY;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1.5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - Math.random() * 1.5;
                this.size = Math.random() * 16 + 10;
                this.icon = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.008;
                this.gravity = 0.03;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.alpha -= this.decay;
            }

            draw() {
                if (this.alpha <= 0) return;
                bCtx.save();
                bCtx.globalAlpha = Math.max(0, this.alpha);
                bCtx.font = `${this.size}px sans-serif`;
                bCtx.textAlign = 'center';
                bCtx.textBaseline = 'middle';
                bCtx.fillText(this.icon, this.x, this.y);
                bCtx.restore();
            }
        }


        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            hearts.forEach(h => {
                h.update();
                h.draw();
            });


            // Tự động tỏa nhẹ từng đợt xung quanh bó hoa
            if (document.getElementById('step2Content').classList.contains('hidden') === false && Math.random() < 0.08) {
                const bouquetImg = document.getElementById('bouquetImg');
                if (bouquetImg) {
                    const rect = bouquetImg.getBoundingClientRect();
                    const rx = rect.left + Math.random() * rect.width;
                    const ry = rect.top + Math.random() * rect.height;
                    burstParticles.push(new BurstParticle(rx, ry));
                }
            }

            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // --- 1. XỬ LÝ THANH GẠT MỞ SLIDER ---
        const startOverlay = document.getElementById('startOverlay');
        const sliderThumb = document.getElementById('sliderThumb');
        let isDragging = false;
        let startX = 0;
        const maxSlide = 220;

        function startDrag(e) {
            isDragging = true;
            startX = (e.touches ? e.touches[0].clientX : e.clientX) - sliderThumb.offsetLeft;
        }

        function doDrag(e) {
            if (!isDragging) return;
            let currentX = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
            if (currentX < 5) currentX = 5;
            if (currentX > maxSlide) currentX = maxSlide;

            sliderThumb.style.left = currentX + 'px';

            if (currentX >= maxSlide - 10) {
                isDragging = false;
                unlockApp();
            }
        }

        function stopDrag() {
            if (!isDragging) return;
            isDragging = false;
            sliderThumb.style.transition = 'left 0.3s ease';
            sliderThumb.style.left = '5px';
            setTimeout(() => { sliderThumb.style.transition = ''; }, 300);
        }

        sliderThumb.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', doDrag);
        window.addEventListener('mouseup', stopDrag);

        sliderThumb.addEventListener('touchstart', startDrag, {passive: true});
        window.addEventListener('touchmove', doDrag, {passive: true});
        window.addEventListener('touchend', stopDrag);

        function unlockApp() {
            startOverlay.style.opacity = '0';
            setTimeout(() => {
                startOverlay.style.visibility = 'hidden';
            }, 800);
        }

        // --- 2. XỬ LÝ MỞ HỘP QUÀ 2.5D & TỎA HẠT TRÁI TIM ---
        const giftBoxBtn = document.getElementById('giftBoxBtn');
        const giftBox25D = document.getElementById('giftBox25D');
        const step1Box = document.getElementById('step1Box');
        const step2Content = document.getElementById('step2Content');

        giftBoxBtn.addEventListener('click', () => {
            // Bật nắp hộp quà 2.5D
            giftBox25D.classList.add('open');

            setTimeout(() => {
                step1Box.style.opacity = '0';
                step1Box.style.transform = 'scale(0.8)';
                
                setTimeout(() => {
                    step1Box.classList.add('hidden');
                    step2Content.classList.remove('hidden');
                    
                    setTimeout(() => {
                        step2Content.style.opacity = '1';
                        step2Content.style.transform = 'translateY(0)';
                        // Bùng nổ hạt trái tim xanh & hồng tỏa ra từ bó hoa
                        triggerBouquetBurst();
                    }, 50);
                }, 400);

            }, 600);
        });

        // Bấm vào bó hoa để bung thêm trái tim tỏa ra
        document.getElementById('bouquetContainer').addEventListener('click', () => {
            triggerBouquetBurst();
        });

    </script>
</body>
</html>
